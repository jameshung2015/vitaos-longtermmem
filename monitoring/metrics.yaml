# monitoring/metrics.yaml
系统监控:
  硬件指标:
    - CPU使用率 (目标: <80%)
    - 内存使用率 (目标: <85%)
    - 磁盘使用率 (目标: <90%)
    - 磁盘IO (目标: <80% IOPS)
    - 网络流量 (目标: <500Mbps)

  服务监控:
    - Ollama服务状态 (目标: 99.9%可用)
    - Chroma数据库状态 (目标: 99.9%可用)
    - 后端应用状态 (目标: 99.9%可用)
    - 嵌入服务延迟 (目标: <50ms)
    - 检索服务延迟 (目标: <20ms)

业务监控:
  功能指标:
    - 记忆存储成功率 (目标: >99%)
    - 记忆检索成功率 (目标: >99.5%)
    - 嵌入向量化成功率 (目标: >99.5%)
    - 端到端响应时间 (目标: <200ms)
    - 并发处理能力 (目标: >100QPS)
